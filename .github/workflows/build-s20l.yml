name: Build S20L WiFi Firmware

on:
  workflow_dispatch:
  push:
    branches: [ master, main, owrt ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Configure for S20L with WiFi
        run: |
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_clx_s20l=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt76=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7986-firmware=y" >> .config
          echo "CONFIG_PACKAGE_wpad-basic-mbedtls=y" >> .config
          echo "CONFIG_PACKAGE_iwinfo=y" >> .config
          make defconfig

      - name: Download Feeds & Update
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Compile Firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S20L-OpenWrt-WiFi-Firmware
          path: bin/targets/mediatek/filogic/
