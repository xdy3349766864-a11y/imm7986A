name: Build S20L WiFi Firmware

on:
  workflow_dispatch:  # 允许你在 Actions 页面手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }} # 使用你 fork 的仓库源码
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Configure for S20L with WiFi
        run: |
          # 这里的关键是生成针对 S20L 的 .config，并确保包含 WiFi 驱动
          # 方式一（推荐）：使用现成的多设备 WiFi 配置模板（如果源码支持）
          # 可以参考 dqsq2e2/wrt_release 项目中的 configs 文件夹
          
          # 方式二：手动指定 target 和 packages（通用思路）
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_clx_s20l=y" >> .config # 设备标识可能因源码而异，请确认
          
          # ⚠️ WiFi 关键包：确保开源 mt76 驱动和相关工具被选中
          echo "CONFIG_PACKAGE_kmod-mt76=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config # Filogic 830 的 2.4G/5G 驱动
          echo "CONFIG_PACKAGE_kmod-mt7986-firmware=y" >> .config
          echo "CONFIG_PACKAGE_wpad-basic-mbedtls=y" >> .config # 无线认证守护进程
          echo "CONFIG_PACKAGE_iwinfo=y" >> .config
          
          # 生成最终配置
          make defconfig

      - name: Download Feeds & Update
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Compile Firmware
        run: |
          make -j$(nproc) V=s
        # 编译可能需要较长时间，请耐心等待

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S20L-OpenWrt-WiFi-Firmware
          path: bin/targets/mediatek/filogic/  # 固件输出路径可能因源码分支而略有不同
